[package]
name = "canopy"
version = "0.1.0"
description = "Canopy core: Groves, vaults, Shares, reveal, claim, instant mint"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "canopy"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
mpl-core = "0.12.1"
spl-associated-token-account = { version = "8.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "11.0.0", features = ["no-entrypoint"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
